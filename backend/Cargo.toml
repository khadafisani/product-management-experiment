[package]
name = "backend"
version = "0.1.0"
edition = "2024"
default-run = "backend"

# Keep executable seeders alongside their shared code and SQL checks.
[[bin]]
name = "seed"
path = "seeds/seed.rs"

[[bin]]
name = "seed_year"
path = "seeds/seed_year.rs"

[dependencies]
axum = "0.8.9"
dotenvy = "0.15.7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["cors", "fs"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "mysql", "migrate", "rust_decimal"] }
reqwest = { version = "0.12", features = ["json"] }
chrono = "0.4"
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
argon2 = "0.5"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
